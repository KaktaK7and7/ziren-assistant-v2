name: Apply screen locator confirmation fix

on:
  push:
    branches:
      - agent/screen-locator-refine-2026-08-04

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/screen-locator-refine-2026-08-04

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply focused patch
        run: python scripts/apply_screen_locator_confirmation_fix.py

      - name: Verify syntax and whitespace
        run: |
          python -m compileall -q app tests
          git diff --check

      - name: Commit product changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/neuro_client.py tests/test_screen_locator_refine.py scripts/apply_screen_locator_confirmation_fix.py .github/workflows/apply-screen-locator-confirmation-fix.yml
          git commit -m "fix: require zoomed confirmation before screen overlay"
          git push origin HEAD:agent/screen-locator-refine-2026-08-04
