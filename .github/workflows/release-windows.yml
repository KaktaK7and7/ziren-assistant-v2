name: Windows release package

on:
  pull_request:
    paths:
      - "app/**"
      - "scripts/prepare_windows_release_assets.py"
      - "assistant-core.spec"
      - "requirements.txt"
      - "requirements-build.txt"
      - ".github/workflows/release-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-core:
    name: Build frozen Core on Windows
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Install runtime and build dependencies
        run: python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Prepare verified Vosk model
        run: python scripts/prepare_windows_release_assets.py

      - name: Build frozen Core
        run: python -m PyInstaller --clean --noconfirm assistant-core.spec

      - name: Run frozen release self-test
        shell: pwsh
        run: |
          $model = (Resolve-Path "build/release-assets/vosk-model-small-ru-0.22").Path
          $env:ZIREN_VOSK_MODEL_PATH = $model
          $process = Start-Process `
            -FilePath ".\dist\assistant-core\assistant-core.exe" `
            -ArgumentList "--release-self-test" `
            -Wait `
            -PassThru `
            -NoNewWindow
          if ($process.ExitCode -ne 0) {
            throw "Frozen Core self-test failed with exit code $($process.ExitCode)"
          }

      - name: Assemble release artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "build/core-package/assistant-core" | Out-Null
          New-Item -ItemType Directory -Force "build/core-package/models/vosk" | Out-Null
          Copy-Item -Recurse -Force "dist/assistant-core/*" "build/core-package/assistant-core/"
          Copy-Item -Recurse -Force `
            "build/release-assets/vosk-model-small-ru-0.22" `
            "build/core-package/models/vosk/vosk-model-small-ru-0.22"
          python -m pip freeze | Out-File -Encoding utf8 "build/core-package/requirements-resolved.txt"
          @{
            schema_version = 1
            component = "ziren-assistant-core"
            git_sha = "${{ github.sha }}"
            python = (python --version 2>&1 | Out-String).Trim()
            vosk_model = "vosk-model-small-ru-0.22"
            vosk_sha256 = "961d5ff98a17f4aa6de69864d0aa71fa5bac682301d2b5d17a3f24c5c99a46d4"
          } | ConvertTo-Json | Out-File -Encoding utf8 "build/core-package/build-info.json"

      - name: Generate SHA-256 manifest
        shell: pwsh
        run: |
          Get-ChildItem -File -Recurse "build/core-package" |
            Sort-Object FullName |
            ForEach-Object {
              $relative = [IO.Path]::GetRelativePath((Resolve-Path "build/core-package"), $_.FullName).Replace("\", "/")
              $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant()
              "$hash  $relative"
            } | Out-File -Encoding ascii "build/core-package/SHA256SUMS.txt"

      - name: Upload frozen Core package
        uses: actions/upload-artifact@v4
        with:
          name: ziren-assistant-core-windows-x64
          path: build/core-package
          if-no-files-found: error
          retention-days: 14
