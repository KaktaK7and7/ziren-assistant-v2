name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python tests and syntax
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Generate website capability manifest
        run: python scripts/export_web_capabilities.py --output build/assistant-capabilities.json

      - name: Validate generated capability manifest
        shell: pwsh
        run: |
          $manifest = Get-Content build/assistant-capabilities.json -Raw | ConvertFrom-Json
          if ($manifest.generated_from -ne "ziren-assistant-v2:ModuleRegistry") {
            throw "Capability manifest is not sourced from ModuleRegistry"
          }
          if (-not $manifest.features -or $manifest.features.Count -lt 1) {
            throw "Capability manifest is empty"
          }
          if ($manifest.features.feature_id -contains "system.test") {
            throw "Internal test capability leaked into public manifest"
          }

      - name: Upload website capability manifest
        uses: actions/upload-artifact@v4
        with:
          name: ziren-web-capabilities
          path: build/assistant-capabilities.json
          if-no-files-found: error
          retention-days: 7

      - name: Compile Python sources
        run: python -m compileall -q app tests scripts
