name: Verify screen locator fix

on:
  push:
    branches:
      - agent/screen-locator-refine-2026-08-04

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/screen-locator-refine-2026-08-04

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Compile Python sources
        run: python -m compileall -q app tests

      - name: Remove one-time workflow after success
        shell: pwsh
        run: |
          Remove-Item .github/workflows/verify-screen-locator-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/verify-screen-locator-fix.yml
          git commit -m "chore: remove one-time locator verification workflow"
          git push origin HEAD:agent/screen-locator-refine-2026-08-04
